<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="widht=device-width, initial-scale=1.0">
        <title>Редактирование студента</title>
        <link rel="icon" type="image/png" href="favicon.ico">
        <link rel="stylesheet" href="css/styles.css">   
    </head>
    <body>
        <header>
            <h1>Система "Управление студентами"</h1>
        </header>
        <main>
            <section id="form-section">
                <h2 id="form-title">Добавление студента</h2>
                <form id="student-form">
                    <label>ФИО:
                        <input type="text" id="stu-name" required placeholder="Иванов Иван Иванович"
                    </label>
                    <label>Группа:
                        <input type="text" id="stu-group" required placeholder="P3223"
                    </label>
                    <label>ИСУ ID:
                        <input type="number" id="stu-isu" required min="100000" max="999999"
                    </label>
                    <label>Номер общажития:
                        <input type="number" id="stu-hostel" required min="1">
                    </label>
                    <label>Срок заселения:
                        <input type="date" id="stu-date" required>
                    </label>
                    <label>
                        <input type="checkbox" id="stu-foreign"> Является ли иностранцем
                    </label>
                    <label>Заметки:
                        <textarea id="stu-notes" rows="4"></textarea>
                    </label>
                    <div class="form-buttons">
                        <button type="submit" id="save-btn">Сохранить</button>
                        <a href="index.html" class="btn-link btn-cancal">Отмена</a>
                    </div>
                </form>
            </section>
        </main>
        <script src="js/storage.js"></script>
        <script src="js/validation.js"></script>
        <script src="js/form-logic.js"></script> 
    </body>
</html>
